name: "🐛 Bug 报告 (Bug Report)"
description: "提交您在使用 CLaJ 过程中遇到的问题或错误"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提交 Bug 报告！请尽可能详尽地填写以下信息，以便我们复现并修复问题。
  - type: input
    id: version
    attributes:
      label: "模组版本 (Mod Version)"
      description: "您正在使用的 CLaJ 模组版本或服务端版本"
      placeholder: "例如: 1.3.0"
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: "Minecraft & Fabric 版本"
      placeholder: "例如: Minecraft 26.2, Fabric Loader 0.19.3"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "问题描述 (Description)"
      description: "清晰简洁地描述遇到的问题"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "复现步骤 (Steps to Reproduce)"
      description: "详细描述如何复现该问题"
      placeholder: |
        1. 进入单人世界
        2. 打开暂停菜单点击「管理 CLaJ 房间」
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "日志与堆栈信息 (Logs & Stacktrace)"
      description: "请粘贴相关的 crash-report 或 latest.log 内容"
      render: shell
