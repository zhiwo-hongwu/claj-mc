name: "✨ 功能请求 (Feature Request)"
description: "为 CLaJ 提出新功能建议或改进方案"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！请清晰描述您的构想。
  - type: textarea
    id: problem
    attributes:
      label: "相关问题 / 现状背景"
      description: "这一功能是为了解决什么痛点或满足什么需求？"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "期望的解决方案"
      description: "您希望该功能如何实现或表现？"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "考虑过的备选方案"
      description: "是否有其他替代方案或临时解决办法？"
